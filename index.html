<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Procedimientos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="app-header">
    <h1>🏥 Gestión de Procedimientos</h1>
    <p class="subtitle">Registro y administración de gestiones de pacientes</p>
  </header>

  <!-- ==================== VISTA PRINCIPAL: LISTA ==================== -->
  <main class="container">
    <section class="card">
      <div class="table-header">
        <h2>📋 Gestiones Registradas</h2>
        <div class="header-actions">
          <button id="btn-refresh" class="btn ghost">🔄 Refrescar</button>
          <button id="btn-nueva" class="btn primary">+ Nueva Gestión</button>
        </div>
      </div>

      <div class="search-bar">
        <input
          type="search"
          id="search"
          placeholder="🔍 Buscar por CUPS, descripción, empresa o especialidad..."
        />
      </div>

      <div class="table-wrap">
        <table id="tabla-gestiones">
          <thead>
            <tr>
              <th>CUPS</th>
              <th>Descripción</th>
              <th>Especialidad</th>
              <th>Empresa</th>
              <th>Valor</th>
              <th>Paquete Qx</th>
              <th>Visto bueno</th>
              <th>Documento</th>
              <th>Paciente</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="10" class="empty">Cargando registros...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ==================== MODAL NUEVA / EDITAR GESTIÓN ==================== -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">

      <div class="modal-header">
        <h2 id="form-title">Registrar Nueva Gestión</h2>
        <button type="button" id="btn-close" class="btn-close" aria-label="Cerrar">✕</button>
      </div>

      <form id="form-gestion" novalidate>
        <input type="hidden" id="row-id" />

        <div class="grid">

          <!-- Código CUPS (opcional) -->
          <div class="field">
            <label for="cups">Código CUPS <span class="opt">(opcional)</span></label>
            <input
              type="text"
              id="cups"
              name="cups"
              placeholder="Ej: 890201"
              autocomplete="off"
            />
          </div>

          <!-- Empresa (select) -->
          <div class="field">
            <label for="empresa">Empresa *</label>
            <select id="empresa" name="empresa" required>
              <option value="">Selecciona una EPS</option>
                  <option value="DUSAKAWI EPS-I">DUSAKAWI EPS-I</option>
                  <option value="ENTIDAD PROMOTORA DE SALUD SANITAS S.A.S">ENTIDAD PROMOTORA DE SALUD SANITAS S.A.S</option>
                  <option value="EPS SURAMERICANA S.A">EPS SURAMERICANA S.A</option>
                  <option value="COLMENA RIESGOS PROFESIONALES S.A.">COLMENA RIESGOS PROFESIONALES S.A.</option>
                  <option value="FIDEICOMISOS PATRIMONIOS AUTONÓMOS FIDUCIARIA LA PREVISORA S.A.">FIDEICOMISOS PATRIMONIOS AUTONÓMOS FIDUCIARIA LA PREVISORA S.A.</option>
                  <option value="GOBERNACION DEL CESAR (SEC DE SALUD)">GOBERNACION DEL CESAR (SEC DE SALUD)</option>
                  <option value="AXA COLPATRIA SEGUROS DE VIDA S.A">AXA COLPATRIA SEGUROS DE VIDA S.A</option>
                  <option value="EPS Familiar De Colombia S.A.S">EPS Familiar De Colombia S.A.S</option>
                  <option value="SUMIMEDICAL SAS">SUMIMEDICAL SAS</option>
                  <option value="MUTUAL SER">MUTUAL SER</option>
                  <option value="PARTICULAR">PARTICULAR</option>
                  <option value="ASMET SALUD">ASMET SALUD</option>
                  <option value="COOSALUD ENTIDAD PROMOTORA DE SALUD S.A">COOSALUD ENTIDAD PROMOTORA DE SALUD S.A</option>
                  <option value="SALUD TOTAL EPS - S.SA.">SALUD TOTAL EPS - S.SA.</option>
                  <option value="PROTEGER EPS S.A.S.">PROTEGER EPS S.A.S.</option>
                  <option value="NUEVA EPS">NUEVA EPS</option>
                  <option value="REGIONAL DE ASEGURAMIENTO Nº 8">REGIONAL DE ASEGURAMIENTO Nº 8</option>
                  <option value="POSITIVA COMPAÑÍA DE SEGUROS S.A. (ARL)">POSITIVA COMPAÑÍA DE SEGUROS S.A. (ARL)</option>
                  <option value="CAPITAL SALUD EPS-S">CAPITAL SALUD EPS-S</option>
                  <option value="SAVIA SALUD">SAVIA SALUD</option>
                  <option value=" EPS FAMISANAR SAS"> EPS FAMISANAR SAS</option>
            </select>
          </div>

          <!-- Especialidad (select) -->
          <div class="field">
            <label for="especialidad">Especialidad *</label>
            <select id="especialidad" name="especialidad" required>
              <option value="">Selecciona una especialidad</option>
              <option value="CIRUGIA MAXILOFACIAL">CIRUGIA MAXILOFACIAL</option>
              <option value="ORTOPEDIA">ORTOPEDIA</option>
              <option value="CIRUGIA PLASTICA">CIRUGIA PLASTICA</option>
              <option value="NEUROCIRUGIA">NEUROCIRUGIA</option>
              <option value="CIRUGIA DE TORAX">CIRUGIA DE TORAX</option>
              <option value="CIRUGIA GENERAL">CIRUGIA GENERAL</option>
              <option value="GASTROENTEROLOGIA">GASTROENTEROLOGIA</option>
              <option value="UROLOGIA">UROLOGIA</option>
              <option value="GINECOLOGIA">GINECOLOGIA</option>
              <option value="INTENSIVISTA">INTENSIVISTA</option>
              <option value="MEDICINA INTERNA">MEDICINA INTERNA</option>
              <option value="RADIOLOGÍA INTERVENCIONISTA">RADIOLOGÍA INTERVENCIONISTA</option>
              <option value="NEONATOLOGIA">NEONATOLOGIA</option>
              <option value="PEDIATRIA">PEDIATRIA</option>
            </select>
          </div>

          <!-- Descripción -->
          <div class="field full">
            <label for="descripcion">Descripción del procedimiento *</label>
            <textarea
              id="descripcion"
              name="descripcion"
              rows="2"
              required
            ></textarea>
          </div>

          <!-- Valor -->
          <div class="field">
            <label for="valor">Valor parametrizado *</label>
            <input
              type="number"
              id="valor"
              name="valor"
              step="0.01"
              min="0"
              required
            />
          </div>

          <!-- Paquete Qx -->
          <div class="field">
            <label for="paquete">Paquete de Qx *</label>
            <input type="text" id="paquete" name="paquete" required />
          </div>

          <!-- Visto bueno -->
          <div class="field">
            <label for="visto">Visto bueno por *</label>
            <input type="text" id="visto" name="visto" required />
          </div>

          <!-- Documento -->
          <div class="field">
            <label for="documento">Documento del paciente *</label>
            <input type="text" id="documento" name="documento" required />
          </div>

          <!-- Nombre -->
          <div class="field">
            <label for="nombre">Nombre del paciente *</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>

        </div>

        <div class="actions">
          <button type="submit" id="btn-submit" class="btn primary">Guardar</button>
          <button type="button" id="btn-cancel" class="btn secondary">Cancelar</button>
        </div>
      </form>

    </div>
  </div>

  <!-- ==================== MODAL DETALLE ==================== -->
  <div id="modal-detalle" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="detalle-title">Detalle de la Gestión</h2>
        <button type="button" id="btn-close-detalle" class="btn-close" aria-label="Cerrar">✕</button>
      </div>

      <dl class="detalle-grid" id="detalle-contenido">
        <!-- Se llena dinámicamente con JS -->
      </dl>

      <div class="actions">
        <button type="button" id="btn-cerrar-detalle" class="btn secondary">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- ==================== TOAST ==================== -->
  <div id="toast" class="toast hidden"></div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
